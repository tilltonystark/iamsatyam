<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character motion playground</title><link rel="stylesheet" href="demo.css"><style>*{box-sizing:border-box}body{margin:0;background:#faf9f5;color:#24271f;font:16px/1.5 Inter,Arial,sans-serif}header,main{margin:auto;max-width:1220px;padding:18px 5%}header{display:flex;gap:20px;border-bottom:1px solid #ddd}h1,h2{font:normal clamp(48px,7vw,100px)/1 Georgia,serif;letter-spacing:-.05em;margin:18px 0}nav{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:3;background:#faf9f5;padding:10px 0}nav b{margin-right:auto}button{cursor:pointer}nav button{border:1px solid #999;border-radius:24px;background:white;padding:9px 16px}section{position:relative;height:clamp(360px,60vh,660px);margin:12px 0;border-radius:12px;background:#f1e6cd}section:nth-of-type(2){background:#dae5d5}section:nth-of-type(3){background:#e0e7ed}.heading{position:absolute;top:48%;left:49%}.heading h2{font-size:clamp(42px,8vw,118px);margin:0}.section-label{position:absolute;top:7%;left:7%;font-size:13px;font-weight:500;margin:0}.small-heading h2{font-size:24px}header a{color:inherit;font-weight:bold;text-decoration:none}button:disabled{opacity:.55;cursor:default}.portrait{position:absolute;width:min(31%,285px);bottom:11%;left:7%}</style><div id="root"></div><script type="module" src="demo.js"></script></html>
