<!doctype html><meta charset="utf-8"><body><pre id="out">running</pre><script>
const pages=['/index.html','/work/jumbo.html','/work/zorro.html','/work/vertera.html','/playground.html','/character.html'];
const widths=[1440,1024,768,375];const out=[];
(async()=>{for(const p of pages)for(const w of widths){const f=document.createElement('iframe');f.width=w;f.height=900;f.src=p;document.body.append(f);
await new Promise(r=>f.onload=r);await new Promise(r=>setTimeout(r,1500));const d=f.contentDocument;
const sw=Math.max(d.documentElement.scrollWidth,d.body.scrollWidth);const wide=[...d.querySelectorAll('body *')].filter(e=>e.getBoundingClientRect().right>w+1&&getComputedStyle(e).position!=='fixed').slice(0,3).map(e=>e.tagName+'.'+e.className);
const broken=[...d.images].filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.src.split('/').pop());
out.push(`${p} @${w}: scrollWidth=${sw} ${sw>w?'OVERFLOW '+wide.join(','):'ok'} ${broken.length?'BROKEN '+broken:''}`);f.remove();}
document.getElementById('out').textContent=out.join('\n');})();
</script>
